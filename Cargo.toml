[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/domain",
    "crates/security",
    "crates/storage",
    "crates/application",
    "crates/provider-runtime",
    "crates/provider-http",
    "crates/e2e-harness",
    "crates/hook-manager",
    "apps/native-messaging-host",
    "crates/pricing",
    "crates/analytics",
    "crates/providers/claude",
    "crates/providers/codex",
    "crates/providers/opencode",
    "crates/providers/ollama",
    "crates/providers/openrouter",
    "crates/providers/gemini",
    "crates/providers/cursor",
    "crates/providers/copilot",
    "crates/providers/grok",
    "crates/providers/kiro",
    "crates/providers/zai",
    "crates/providers/zcode",
    "crates/providers/kimi",
    "crates/providers/kilo-cli",
    "crates/providers/kilo-code",
    "crates/providers/mimo",
    "crates/providers/roo",
    "crates/providers/codebuddy",
    "crates/providers/workbuddy",
    "crates/providers/pi-agent",
    "crates/providers/omp",
    "crates/providers/hermes",
    "crates/provider-contract-tests",
    "crates/windows-integration",
]

# Keep local debug/test iteration light while leaving release code generation
# parallel and avoiding an extra LTO pass unless a release explicitly opts in.
# CI's sccache setup disables incremental compilation because incremental
# artifacts cannot be reused by the compiler cache.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = 0
opt-level = 0

[profile.test]
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
debug = 0
opt-level = 0

[profile.release]
codegen-units = 16
debug = 0
incremental = false
lto = false
