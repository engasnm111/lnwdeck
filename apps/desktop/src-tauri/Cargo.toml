[package]
name = "lnwdeck-desktop"
version = "11.0.1"
description = "lnwdeck desktop application"
authors = ["lnwdeck contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lnwdeck_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "lnwdeck-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
lnwdeck-domain = { path = "../../../crates/domain" }
lnwdeck-security = { path = "../../../crates/security" }
lnwdeck-storage = { path = "../../../crates/storage" }
lnwdeck-application = { path = "../../../crates/application" }
lnwdeck-pricing = { path = "../../../crates/pricing" }
lnwdeck-analytics = { path = "../../../crates/analytics" }
lnwdeck-hook-manager = { path = "../../../crates/hook-manager" }
lnwdeck-provider-runtime = { path = "../../../crates/provider-runtime" }
lnwdeck-windows-integration = { path = "../../../crates/windows-integration" }
lnwdeck-provider-http = { path = "../../../crates/provider-http" }
lnwdeck-provider-claude = { path = "../../../crates/providers/claude" }
lnwdeck-provider-codex = { path = "../../../crates/providers/codex" }
lnwdeck-provider-copilot = { path = "../../../crates/providers/copilot" }
lnwdeck-provider-cursor = { path = "../../../crates/providers/cursor" }
lnwdeck-provider-gemini = { path = "../../../crates/providers/gemini" }
lnwdeck-provider-grok = { path = "../../../crates/providers/grok" }
lnwdeck-provider-kiro = { path = "../../../crates/providers/kiro" }
lnwdeck-provider-ollama = { path = "../../../crates/providers/ollama" }
lnwdeck-provider-opencode = { path = "../../../crates/providers/opencode" }
lnwdeck-provider-openrouter = { path = "../../../crates/providers/openrouter" }
lnwdeck-provider-zai = { path = "../../../crates/providers/zai" }
lnwdeck-provider-zcode = { path = "../../../crates/providers/zcode" }
lnwdeck-provider-kimi = { path = "../../../crates/providers/kimi" }
lnwdeck-provider-kilo-cli = { path = "../../../crates/providers/kilo-cli" }
lnwdeck-provider-kilo-code = { path = "../../../crates/providers/kilo-code" }
lnwdeck-provider-mimo = { path = "../../../crates/providers/mimo" }
lnwdeck-provider-roo = { path = "../../../crates/providers/roo" }
lnwdeck-provider-codebuddy = { path = "../../../crates/providers/codebuddy" }
lnwdeck-provider-workbuddy = { path = "../../../crates/providers/workbuddy" }
lnwdeck-provider-pi-agent = { path = "../../../crates/providers/pi-agent" }
lnwdeck-provider-omp = { path = "../../../crates/providers/omp" }
lnwdeck-provider-hermes = { path = "../../../crates/providers/hermes" }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Timeout for refresh cycles (already in the workspace lockfile via Tauri).
tokio = { version = "1", features = ["time"] }
# Validates .codex-pet.zip packages for the widget pet import. Already in the
# workspace lockfile through Tauri's bundler, so no new transitive tree.
zip = "4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"
minisign-verify = "0.2"
