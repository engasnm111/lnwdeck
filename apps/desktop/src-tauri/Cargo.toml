[package]
name = "inwdeck-desktop"
version = "0.1.0"
description = "inwdeck desktop application"
authors = ["inwdeck contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "inwdeck_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "inwdeck-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
