[package]
name = "lnwdeck-native-messaging-host"
version = "0.2.0"
edition = "2021"
description = "Native messaging host for lnwdeck browser helper"

[[bin]]
name = "lnwdeck-browser-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
lnwdeck-storage = { path = "../../crates/storage" }

[dev-dependencies]
