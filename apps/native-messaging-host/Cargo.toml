[package]
name = "inwdeck-native-messaging-host"
version = "0.1.0"
edition = "2021"
description = "Native messaging host for inwdeck browser helper"

[[bin]]
name = "inwdeck-browser-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
