[package]
name = "lnwdeck-provider-opencode"
version = "0.2.0"
edition = "2021"
description = "OpenCode CLI provider adapter for lnwdeck"

[dependencies]
lnwdeck-domain = { path = "../../domain" }
lnwdeck-provider-http = { path = "../../provider-http" }
lnwdeck-provider-runtime = { path = "../../provider-runtime" }
lnwdeck-security = { path = "../../security" }
lnwdeck-windows-integration = { path = "../../windows-integration" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
