[package]
name = "lnwdeck-provider-copilot"
version = "0.2.0"
edition = "2021"
description = "GitHub Copilot provider adapter for lnwdeck"

[dependencies]
lnwdeck-domain = { path = "../../domain" }
lnwdeck-provider-runtime = { path = "../../provider-runtime" }
lnwdeck-provider-http = { path = "../../provider-http" }
chrono = { version = "0.4" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
