[package]
name = "lnwdeck-provider-zcode"
version = "0.1.0"
edition = "2021"
description = "ZCode (Z.AI) provider adapter for lnwdeck"

[dependencies]
lnwdeck-domain = { path = "../../domain" }
lnwdeck-provider-runtime = { path = "../../provider-runtime" }
lnwdeck-provider-http = { path = "../../provider-http" }
chrono = { version = "0.4" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
