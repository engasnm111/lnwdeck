[package]
name = "lnwdeck-provider-zcode"
version = "0.1.0"
edition = "2021"
description = "ZCode (Z.AI) provider adapter for lnwdeck"

[dependencies]
lnwdeck-domain = { path = "../../domain" }
lnwdeck-provider-runtime = { path = "../../provider-runtime" }
lnwdeck-provider-http = { path = "../../provider-http" }
chrono = { version = "0.4" }
serde_json = "1"
# ZCode 3.14+ stores its credentials as AES-256-GCM values keyed by a SHA-256
# digest of the local user identity. Only decryption is used; the client is
# configured without default features so no RNG or OS entropy source is pulled
# in. Licenses: aes-gcm (Apache-2.0 OR MIT), base64 (Apache-2.0 OR MIT),
# sha2 (Apache-2.0 OR MIT).
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.43", features = ["bundled"] }
