[package]
name = "lnwdeck-provider-cursor"
version = "0.2.0"
edition = "2021"
description = "Cursor IDE provider adapter for lnwdeck"

[dependencies]
lnwdeck-domain = { path = "../../domain" }
lnwdeck-provider-http = { path = "../../provider-http" }
lnwdeck-provider-runtime = { path = "../../provider-runtime" }
chrono = { version = "0.4" }
rusqlite = { version = "0.31", features = ["bundled"] }
csv = "1"
base64 = "0.22"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
