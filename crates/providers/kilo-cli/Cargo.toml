[package]
name = "lnwdeck-provider-kilo-cli"
version = "0.1.0"
edition = "2021"
description = "Kilo CLI provider adapter for lnwdeck"

[dependencies]
lnwdeck-domain = { path = "../../domain" }
lnwdeck-provider-runtime = { path = "../../provider-runtime" }
chrono = { version = "0.4" }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
