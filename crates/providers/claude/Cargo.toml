[package]
name = "lnwdeck-provider-claude"
version = "0.1.0"
edition = "2021"
description = "Claude/Anthropic provider adapter for lnwdeck"

[dependencies]
lnwdeck-domain = { path = "../../domain" }
lnwdeck-provider-runtime = { path = "../../provider-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
