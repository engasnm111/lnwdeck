[package]
name = "lnwdeck-storage"
version = "0.1.0"
edition = "2021"
description = "SQLite storage, migrations and repositories for lnwdeck"

[dependencies]
lnwdeck-domain = { path = "../domain" }
lnwdeck-security = { path = "../security" }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
