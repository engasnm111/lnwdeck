[package]
name = "lnwdeck-application"
version = "0.1.0"
edition = "2021"
description = "Application layer use cases and orchestration for lnwdeck"

[dependencies]
lnwdeck-domain = { path = "../domain" }
lnwdeck-security = { path = "../security" }
lnwdeck-storage = { path = "../storage" }
lnwdeck-provider-runtime = { path = "../provider-runtime" }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
