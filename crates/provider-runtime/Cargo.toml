[package]
name = "inwdeck-provider-runtime"
version = "0.1.0"
edition = "2021"
description = "Provider adapter runtime, scheduler and permissions for inwdeck"

[dependencies]
inwdeck-domain = { path = "../domain" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
