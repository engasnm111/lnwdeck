[package]
name = "lnwdeck-provider-runtime"
version = "0.2.0"
edition = "2021"
description = "Provider adapter runtime, scheduler and permissions for lnwdeck"

[dependencies]
lnwdeck-domain = { path = "../domain" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
