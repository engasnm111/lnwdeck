[package]
name = "lnwdeck-security"
version = "0.1.0"
edition = "2021"
description = "Privacy guard, redaction and keyed identifiers for lnwdeck"

[dependencies]
lnwdeck-domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
