[package]
name = "lnwdeck-windows-integration"
version = "0.2.0"
edition = "2021"
description = "Windows-specific integration services for lnwdeck"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }
