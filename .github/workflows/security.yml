name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-scan:
    name: Privacy scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan for sensitive data
        run: node scripts/scan-artifacts-for-sensitive-data.mjs

      - name: Fail if private key material is tracked
        shell: pwsh
        run: |
          $tracked = git ls-files 'keys/*'
          if ($tracked) {
            Write-Output "::error::private key material is tracked: $tracked"
            exit 1
          }
          Write-Output "no key material is tracked"

  dependency-audit:
    name: Dependency audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # An audit only means something when the tool is installed and its exit
      # status is respected; the previous version swallowed both.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Generate a lockfile
        run: cargo generate-lockfile

      # Exits non-zero on a vulnerability. Informational advisories are printed
      # for review; audit.toml documents why they are not fatal here.
      - name: Check advisories
        run: cargo audit
