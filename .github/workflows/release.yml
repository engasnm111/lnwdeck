name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  # Manual trigger fallback: GitHub push events can be delayed when a region
  # of github.com is degraded; this lets a maintainer start the release
  # pipeline immediately without waiting for event processing.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check tag matches application versions
        run: node scripts/check-release-version.mjs "${{ github.ref_name }}"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - i686-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-workspace-crates: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Harden Windows runner
        uses: ./.github/actions/harden-windows

      # A missing signing key would otherwise fail later with an opaque bundler
      # error, or silently produce unsigned artifacts.
      - name: Verify the signing key is configured
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Output "::error::TAURI_SIGNING_PRIVATE_KEY is not set; updater artifacts cannot be signed"
            exit 1
          }
          Write-Output "signing key is configured"

      - name: Build the native messaging host
        shell: pwsh
        run: |
          pwsh scripts/ci-retry.ps1 -Command "cargo build -p lnwdeck-native-messaging-host --target ${{ matrix.target }} --release" -Label "native messaging host (${{ matrix.target }})"
          Get-Item "target/${{ matrix.target }}/release/lnwdeck-browser-host.exe" |
            Select-Object FullName, Length

      - name: Build signed bundles (no publish)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          # Invoke the project-local CLI directly so the already-installed
          # workspace dependencies are reused and only the shipped NSIS
          # bundle is generated.
          pnpm --filter @lnwdeck/desktop tauri build --ci --target ${{ matrix.target }} --bundles nsis

      - name: Verify updater signatures exist
        shell: pwsh
        run: |
          $bundle = "target/${{ matrix.target }}/release/bundle"
          $sigs = @(Get-ChildItem -Recurse $bundle -Filter "*.sig" -ErrorAction SilentlyContinue)
          if ($sigs.Count -eq 0) {
            Write-Output "::error::no .sig files found under $bundle"
            Get-ChildItem -Recurse $bundle -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Output "::error::file: $($_.FullName)" }
            exit 1
          }
          Write-Output "found $($sigs.Count) signature(s)"
          $sigs | ForEach-Object { Write-Output "sig: $($_.FullName)" }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          # Cargo --target builds land in target/<triple>/release (workspace root).
          # The archive name carries the architecture so the three matrix jobs
          # publish three distinct ZIPs instead of overwriting each other.
          powershell -ExecutionPolicy Bypass -File scripts/package-portable.ps1 `
            -BuildDir "target/${{ matrix.target }}/release" `
            -Arch "${{ matrix.target == 'x86_64-pc-windows-msvc' && 'x64' || (matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'x86') }}"

      - name: Sign portable ZIP
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $portable = @(Get-ChildItem -LiteralPath . -Filter "lnwdeck_*_portable.zip" -File)
          if ($portable.Count -ne 1) {
            Write-Output "::error::expected exactly one portable ZIP, found $($portable.Count)"
            exit 1
          }
          & node apps/desktop/node_modules/@tauri-apps/cli/tauri.js signer sign --private-key $env:TAURI_SIGNING_PRIVATE_KEY $portable.FullName
          if (-not (Test-Path "$($portable.FullName).sig")) {
            Write-Output "::error::portable signature was not created"
            exit 1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.sig
            lnwdeck_*_portable.zip
            lnwdeck_*_portable.zip.sig
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -R dist-assets

      # The download preserves the upload paths, so installers arrive several
      # directories deep. Release assets must be plain files, so they are
      # flattened first; a name collision fails the run rather than silently
      # replacing one architecture's installer with another's.
      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find dist-assets -type f \( -name '*.exe' -o -name '*.sig' -o -name '*.zip' -o -name '*.msi' \) -print0 |
            while IFS= read -r -d '' file; do
              name=$(basename "$file")
              if [ -e "release-assets/$name" ]; then
                echo "::error::duplicate release asset: $name"
                exit 1
              fi
              cp "$file" "release-assets/$name"
            done
          ls -l release-assets

      # Fails when an installer has no signature, so a release cannot be
      # published without a verifiable updater manifest.
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          path: .
          format: cyclonedx-json
          output-file: release-assets/lnwdeck-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Resolve release notes file
        id: notes
        run: |
          BASE=$(echo "${{ github.ref_name }}" | sed -E 's/-rc\.[0-9]+$//')
          FILE="docs/releases/${BASE}.md"
          if [ ! -f "$FILE" ]; then
            echo "missing release notes: $FILE" >&2
            exit 1
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      # The updater manifest must know each installer's GitHub asset id so it
      # can point at api.github.com (reachable where github.com is blocked or
      # degraded) instead of the release download page. Asset ids only exist
      # after the release is created, so a draft release is published first and
      # finalized only after the manifest and checksums are attached.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/lnwdeck_*_setup.exe \
            release-assets/lnwdeck_*_portable.zip \
            release-assets/*.sig \
            release-assets/lnwdeck-sbom.cdx.json \
            --repo "${{ github.repository }}" \
            --title "lnwdeck ${{ github.ref_name }}" \
            --draft \
            --prerelease=${{ contains(github.ref_name, '-') }}

      - name: Resolve installer asset ids
        id: asset-ids
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IDS=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            --jq '[.assets[] | {key: .name, value: .id}] | from_entries')
          echo "LNWDECK_ASSET_IDS=$IDS" >> "$GITHUB_ENV"
          echo "resolved asset ids: $IDS"

      - name: Generate updater latest.json
        run: |
          node scripts/generate-updater-json.mjs "${{ github.ref_name }}" release-assets release-assets/latest.json
          cat release-assets/latest.json

      - name: Attach updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" release-assets/latest.json \
            --repo "${{ github.repository }}" --clobber

      - name: Verify every architecture, signature and manifest entry
        run: node scripts/verify-release-assets.mjs release-assets "${{ github.ref_name }}"

      - name: Generate SHA256SUMS and verify it immediately
        run: |
          node scripts/generate-release-metadata.mjs release-assets
          (cd release-assets && sha256sum -c SHA256SUMS)

      - name: Attach checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" release-assets/SHA256SUMS \
            --repo "${{ github.repository }}" --clobber

      # The repository-root manifest feeds the raw.githubusercontent.com and
      # jsDelivr updater endpoints so users whose network cannot reach
      # github.com still get update checks. [skip ci] prevents this commit
      # from re-triggering the main-branch CI.
      - name: Publish manifest to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp release-assets/latest.json latest.json
          git add latest.json
          git diff --cached --quiet || {
            git commit -m "chore: publish updater manifest for ${{ github.ref_name }} [skip ci]"
            git push origin main
          }

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --prerelease=${{ contains(github.ref_name, '-') }} \
            --notes-file "${{ steps.notes.outputs.path }}"
