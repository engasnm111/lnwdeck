name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches application versions
        run: node scripts/check-release-version.mjs "${{ github.ref_name }}"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - i686-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed bundles (no publish)
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Password is intentionally empty (key generated with --ci).
          # GitHub Actions sets CI=true, which makes the Tauri CLI fall back to
          # an empty password when TAURI_SIGNING_PRIVATE_KEY_PASSWORD is unset.
        with:
          projectPath: apps/desktop/src-tauri
          publish: false
          args: --target ${{ matrix.target }}

      - name: Package portable ZIP
        shell: pwsh
        run: |
          # Tauri builds into the workspace-root target dir (cargo workspace)
          powershell -ExecutionPolicy Bypass -File scripts/package-portable.ps1 `
            -BuildDir "target/release"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.sig
            lnwdeck_*_portable.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      - name: Generate updater latest.json
        run: node scripts/generate-updater-json.mjs "${{ github.ref_name }}" dist-assets

      - name: Resolve release notes file
        id: notes
        run: |
          BASE=$(echo "${{ github.ref_name }}" | sed -E 's/-rc\.[0-9]+$//')
          FILE="docs/releases/${BASE}.md"
          if [ ! -f "$FILE" ]; then
            echo "missing release notes: $FILE" >&2
            exit 1
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist-assets/* \
            --repo "${{ github.repository }}" \
            --title "lnwdeck ${{ github.ref_name }}" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            --draft=false \
            --prerelease=${{ contains(github.ref_name, '-') }}
