name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep CI failures deterministic: a warning is an error.
  RUSTFLAGS: -D warnings
  # The Windows runner has ~7 GB of RAM; clippy/check over the whole
  # workspace with tests and all features can exceed that when parallel
  # compile is left at the default (one job per core), killing cargo
  # silently. Bound it so the run completes.
  CARGO_BUILD_JOBS: 2

jobs:
  check:
    name: Check (fmt, clippy, typecheck)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        shell: pwsh
        run: |
          pnpm check *> checks.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content checks.log | Select-Object -Last 60 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run the suites one at a time so a failure names the suite that broke.
      # Failures are echoed through ::error:: so the failing line appears in
      # the check annotations, not only in the job logs.
      - name: Rust tests
        shell: pwsh
        run: |
          pnpm run test:rs *> rust-tests.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content rust-tests.log | Select-Object -Last 50 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: Frontend tests
        shell: pwsh
        run: |
          pnpm run test:ts *> frontend-tests.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content frontend-tests.log | Select-Object -Last 50 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: Release script tests
        shell: pwsh
        run: |
          pnpm run release:test *> release-tests.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content release-tests.log | Select-Object -Last 50 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: End-to-end pipeline test
        shell: pwsh
        run: |
          pnpm run test:e2e *> e2e-test.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content e2e-test.log | Select-Object -Last 50 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: Release version consistency
        shell: pwsh
        run: |
          node scripts/check-release-version.mjs "v$(node -p "require('./installer/package-config.json').version")" *> version-check.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content version-check.log | Select-Object -Last 30 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

  e2e-ui:
    name: UI E2E (Playwright + WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-ui

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cross-compiling to aarch64 needs clang for ring/libsqlite3-sys (C
      # build scripts); the GitHub runner does not expose it on PATH by
      # default, and without it the custom build commands fail.
      - name: Install LLVM for ARM64 cross-compilation
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            $env:Path = "$env:ProgramFiles\LLVM\bin;" + $env:Path
          }
          echo "CC_aarch64_pc_windows_msvc=clang" >> $env:GITHUB_ENV

      - name: Build release app (no bundle)
        shell: pwsh
        run: |
          pnpm --filter @lnwdeck/desktop run tauri build --no-bundle *> e2e-build.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content e2e-build.log | Select-Object -Last 60 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: Run Playwright UI smoke tests
        shell: pwsh
        run: |
          pnpm --filter @lnwdeck/desktop run e2e:run *> e2e-ui.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content e2e-ui.log | Select-Object -Last 60 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

  compile:
    name: Compile (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The target's standard library must be installed, otherwise
      # `cargo check --target` fails to find `core`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: compile-${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @lnwdeck/desktop run build

      - name: cargo check
        shell: pwsh
        run: |
          cargo check --workspace --all-targets --target ${{ matrix.target }} *> cargo-check.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content cargo-check.log | Select-Object -Last 60 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
