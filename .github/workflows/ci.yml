name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (fmt + clippy + typecheck)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup show

      - name: Install dependencies
        run: pnpm install

      - name: Run checks
        run: pnpm check

  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup show

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

  compile-x86_64:
    name: Compile (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup show

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo check (x86_64)
        run: cargo check --target x86_64-pc-windows-msvc

  compile-aarch64:
    name: Compile (aarch64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup show

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo check (aarch64)
        run: cargo check --target aarch64-pc-windows-msvc

  compile-i686:
    name: Compile (i686-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup show

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo check (i686)
        run: cargo check --target i686-pc-windows-msvc
