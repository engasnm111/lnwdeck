name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep CI failures deterministic: a warning is an error.
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
  CARGO_PROFILE_CHECK_DEBUG: "line-tables-only"

jobs:
  check:
    name: Check (fmt, clippy, typecheck)
    runs-on: windows-2022
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Harden Windows runner
        uses: ./.github/actions/harden-windows

      # Clippy is the heaviest step in this job; a silent mid-compile kill on
      # the hosted runner is retried with a clean artifact tree instead of
      # failing the whole pipeline on a transient. Each command runs in its
      # own invocation (PS 5.1 has no &&) and aborts the step on failure.
      - name: Run checks
        shell: pwsh
        run: |
          pwsh scripts/ci-retry.ps1 -Command "cargo fmt --check" -Label "fmt"
          pwsh scripts/ci-retry.ps1 -Command "cargo clippy --workspace --all-targets --all-features -- -D warnings" -Label "clippy"
          pwsh scripts/ci-retry.ps1 -Command "pnpm -r run typecheck" -Label "typecheck"

  test:
    name: Test
    runs-on: windows-2022
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Harden Windows runner
        uses: ./.github/actions/harden-windows

      # Run the suites one at a time so a failure names the suite that broke.
      # Each suite retries transient runner kills; the final failure prints
      # the log tail as check annotations.
      - name: Rust tests
        shell: pwsh
        run: |
          pwsh scripts/ci-retry.ps1 -Command "cargo test -p lnwdeck-native-messaging-host" -Label "native-messaging-host tests"
          pwsh scripts/ci-retry.ps1 -Command "cargo test -p lnwdeck-desktop" -Label "desktop tests"
          pwsh scripts/ci-retry.ps1 -Command "cargo test --workspace --exclude lnwdeck-native-messaging-host --exclude lnwdeck-desktop" -Label "workspace tests"

      - name: Frontend tests
        shell: pwsh
        run: |
          pwsh scripts/ci-retry.ps1 -Command "pnpm run test:ts" -Label "frontend tests"

      - name: Release script tests
        shell: pwsh
        run: |
          pwsh scripts/ci-retry.ps1 -Command "pnpm run release:test" -Label "release script tests"

      - name: End-to-end pipeline test
        shell: pwsh
        run: |
          pwsh scripts/ci-retry.ps1 -Command "pnpm run test:e2e" -Label "pipeline e2e"

      - name: Release version consistency
        shell: pwsh
        run: |
          node scripts/check-release-version.mjs "v$(node -p "require('./installer/package-config.json').version")"

  e2e-ui:
    name: UI E2E (Playwright + WebView2)
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
      LNWD_E2E_BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Harden Windows runner
        uses: ./.github/actions/harden-windows

      - name: Build native messaging host
        shell: pwsh
        run: |
          pwsh scripts/ci-retry.ps1 -Command "cargo build -p lnwdeck-native-messaging-host" -Label "native messaging host (debug)"
          Get-Item "target/debug/lnwdeck-browser-host.exe" |
            Select-Object FullName, Length

      - name: Build debug app (no bundle)
        shell: pwsh
        run: |
          pwsh scripts/ci-retry.ps1 -Command "pnpm --filter @lnwdeck/desktop run tauri build --debug --no-bundle" -Label "debug app build"

      - name: Run Playwright UI smoke tests
        shell: pwsh
        run: pnpm --filter @lnwdeck/desktop run e2e:run

  compile:
    name: Compile (${{ matrix.target }})
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # The target's standard library must be installed, otherwise
      # `cargo check --target` fails to find `core`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: compile-${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Harden Windows runner
        uses: ./.github/actions/harden-windows

      # ARM64 check runs C build scripts (ring, libsqlite3-sys) that need
      # clang as the C compiler for the cross target.
      - name: Install LLVM for ARM64 cross-compilation
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            $env:Path = "$env:ProgramFiles\LLVM\bin;" + $env:Path
          }
          echo "CC_aarch64_pc_windows_msvc=clang" >> $env:GITHUB_ENV

      - name: Build native messaging host
        shell: pwsh
        run: |
          pwsh scripts/ci-retry.ps1 -Command "cargo build -p lnwdeck-native-messaging-host --target ${{ matrix.target }}" -Label "native messaging host ${{ matrix.target }} (debug)"
          Get-Item "target/${{ matrix.target }}/debug/lnwdeck-browser-host.exe" |
            Select-Object FullName, Length

      - name: Build frontend
        run: pnpm --filter @lnwdeck/desktop run build

      - name: cargo check
        shell: pwsh
        run: |
          pwsh scripts/ci-retry.ps1 -Command "cargo check --workspace --target ${{ matrix.target }}" -Label "cargo check ${{ matrix.target }}"
